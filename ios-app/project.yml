name: OpenFlux
options:
  bundleIdPrefix: com.p1neapplexpress-saharev
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "122"
    DEVELOPMENT_TEAM: "8GQH8GQ252"

targets:
  OpenFlux:
    type: application
    platform: iOS
    sources:
      - path: OpenFlux
      - path: Lib
        buildPhase: none
    dependencies:
      - framework: Lib/liboflux.a
        embed: false
      # The shared Compose UI (iosUi/ + shared/, Kotlin/Native, static): the app only, never
      # the tunnel extension, whose 50 MB limit it would eat into.
      - framework: ../iosUi/build/bin/iosArm64/releaseFramework/OpenFluxUI.framework
        embed: false
      - target: OpenFluxTunnel
      - target: OpenFluxControls
    info:
      path: OpenFlux/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: "Сканирование QR-кода конфигурации для добавления профиля."
        # Compose Multiplatform (the shared Kotlin UI) checks this at start and
        # aborts without it: ProMotion screens may then run at 120 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    # The shared UI's Compose resources (transport and tab icons). Xcode's KMP
    # integration would sync them; with the framework linked by hand they are
    # copied here, to where Compose looks for them on iOS.
    postCompileScripts:
      - name: Copy Compose resources
        basedOnDependencyAnalysis: false
        script: |
          SRC="$SRCROOT/../shared/build/generated/compose/resourceGenerator/preparedResources/commonMain/composeResources"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/compose-resources/composeResources/io.openflux.desktop.resources"
          if [ ! -d "$SRC" ]; then echo "error: $SRC missing - build the Kotlin UI first (./gradlew)"; exit 1; fi
          mkdir -p "$DST" && cp -R "$SRC/" "$DST/"
    entitlements:
      path: OpenFlux/OpenFlux.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        # Shared with the tunnel extension so the encryption secret lives in the
        # Keychain instead of the VPN provider configuration.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.p1neapplexpress-saharev.openflux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1neapplexpress-saharev.openflux
        PRODUCT_NAME: OpenFlux
        INFOPLIST_KEY_CFBundleDisplayName: OpenFlux
        SWIFT_OBJC_BRIDGING_HEADER: OpenFlux/OpenFlux-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Lib"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Lib"
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../iosUi/build/bin/iosArm64/releaseFramework"
        # The Compose-resources copy phase reads shared/, outside the project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS:
          - "-lresolv"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "Security"
        CODE_SIGN_STYLE: Automatic

  OpenFluxTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenFluxTunnel
      # Shared with the app: the extension reads the encryption secret from the
      # same Keychain group, so it needs the same accessor.
      - path: OpenFlux/Secrets.swift
      - path: Lib
        buildPhase: none
    dependencies:
      - framework: Lib/liboflux.a
        embed: false
    info:
      path: OpenFluxTunnel/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: OpenFlux Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: OpenFluxTunnel/OpenFluxTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.p1neapplexpress-saharev.openflux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1neapplexpress-saharev.openflux.tunnel
        PRODUCT_NAME: OpenFluxTunnel
        SWIFT_OBJC_BRIDGING_HEADER: OpenFluxTunnel/Tunnel-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Lib"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Lib"
        OTHER_LDFLAGS:
          - "-lresolv"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "Security"
        CODE_SIGN_STYLE: Automatic
  # Control Center's OpenFlux switch (iOS 18 controls): starts and stops the VPN
  # configuration the app saved, as Settings → VPN does.
  OpenFluxControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: OpenFluxControls
    info:
      path: OpenFluxControls/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: OpenFlux
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OpenFluxControls/OpenFluxControls.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1neapplexpress-saharev.openflux.controls
        PRODUCT_NAME: OpenFluxControls
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  # On-device UI checks run from the Mac (xcodebuild test on the developer's phone).
  OpenFluxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OpenFluxUITests
    dependencies:
      - target: OpenFlux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1neapplexpress-saharev.openflux.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: OpenFlux

schemes:
  OpenFlux:
    build:
      targets:
        OpenFlux: all
    archive:
      config: Release
    test:
      config: Release
      targets:
        - OpenFluxUITests

